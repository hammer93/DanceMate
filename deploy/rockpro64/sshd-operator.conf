# DanceMate operator hardening (v0.82.8) - reference copy.
#
# Install as /etc/ssh/sshd_config.d/90-dancemate-operator.conf on the
# ROCKPro64 (Debian's sshd_config already has `Include
# /etc/ssh/sshd_config.d/*.conf` near its own top, so a drop-in here
# overrides the distro default further down the same file - confirmed with
# `sshd -T` before relying on it).
#
# hammer is the canonical repository/deploy operator - see
# deploy/rockpro64/README.md's "Canonical board workflow" and
# scripts/setup-board-operator.sh (provisions hammer's own authorized_keys).
#
# DO NOT copy this into place until BOTH of the following are true, verified
# with real, independent, freshly-connected SSH sessions - not just
# `sudo -u hammer` inside an existing root session:
#   1. `ssh hammer@<board>` succeeds on its own, at least twice.
#   2. From that session: git, docker, `scripts/deploy-production.sh --check`
#      and `sudo` all work.
# Skipping this order risks losing root SSH access with no way back in.
#
# After copying into place:
#   sshd -t                    # syntax check - do not reload if this fails
#   systemctl reload ssh       # never restart; a reload cannot drop an
#                               # already-established session
#   ssh hammer@<board>         # reconnect once more to confirm nothing broke
#
# PermitRootLogin prohibit-password: root can still log in with whatever key
# is already in /root/.ssh/authorized_keys, for OS/service-level emergency
# work - password-guessing root is no longer possible. This is narrower than
# disabling PasswordAuthentication globally, which also needs console/local-
# access recovery verified first (not done as of v0.82.8) - left untouched.
PermitRootLogin prohibit-password
