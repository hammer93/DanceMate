# DanceMate v0.74 - Persistent Runtime + ROCKPro64 Staging Deployment.
#
# Three containers on purpose: postgres, runtime, scheduler. The runtime and
# the scheduler share ONE image and differ only by command, which keeps memory
# and microSD footprint small on the 4GB / 32GB ROCKPro64 target.
#
# LAN ONLY. There is no authentication on the runtime API. The host must stay
# behind the LAN firewall with no WAN port forwarding. Set
# DANCEMATE_BIND_ADDRESS to the board's LAN address to narrow the binding.
#
# Persistence model (hybrid, see deploy/rockpro64/README.md):
#   PostgreSQL  -> runtime state, scheduler heartbeat, job history
#   SQLite      -> Information Engine v0.73 keeps its own store, unchanged
#
# Path convention: variables in .env name HOST paths. The container-side paths
# are pinned in each service's `environment:` block, which overrides env_file.

x-runtime-image: &runtime-image
  build:
    context: .
    dockerfile: Dockerfile
  image: dancemate/runtime:${DANCEMATE_VERSION:-0.77}
  restart: unless-stopped
  env_file: [.env]
  # microSD write minimization: cap container logs instead of letting the
  # json-file driver grow without bound.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dancemate}
      POSTGRES_USER: ${POSTGRES_USER:-dancemate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Runtime state only; a Korean-locale collation buys nothing here.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dancemate} -d ${POSTGRES_DB:-dancemate}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Not published on the host: only the runtime and scheduler need it.
    expose:
      - "5432"

  runtime:
    <<: *runtime-image
    command: ["python", "-m", "runtime"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Container-side paths. These intentionally override the HOST paths that
      # .env carries for the bind mounts below.
      # The container has no LAN address of its own: always listen on all
      # of its interfaces. DANCEMATE_BIND_ADDRESS narrows the HOST side.
      DANCEMATE_HOST: 0.0.0.0
      ENGINE_ROOT: /app/engine
      ENGINE_DATA_DIR: /app/engine/data
      DANCEMATE_DATA_DIR: /var/lib/dancemate
      DANCEMATE_LOG_DIR: /var/log/dancemate
      DANCEMATE_BACKUP_DIR: /var/backups/dancemate
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${DANCEMATE_BIND_ADDRESS:-0.0.0.0}:${DANCEMATE_PORT:-8080}:8080"
    volumes:
      - ${ENGINE_DATA_DIR:-./data/engine}:/app/engine/data
      - ${DANCEMATE_DATA_DIR:-./data/runtime}:/var/lib/dancemate
      - ${DANCEMATE_LOG_DIR:-./logs}:/var/log/dancemate
      - ${DANCEMATE_BACKUP_DIR:-./backup}:/var/backups/dancemate
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  scheduler:
    <<: *runtime-image
    command: ["python", "-m", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      # The runtime owns migrations; the scheduler must not race them.
      runtime:
        condition: service_healthy
    environment:
      # The container has no LAN address of its own: always listen on all
      # of its interfaces. DANCEMATE_BIND_ADDRESS narrows the HOST side.
      DANCEMATE_HOST: 0.0.0.0
      ENGINE_ROOT: /app/engine
      ENGINE_DATA_DIR: /app/engine/data
      DANCEMATE_DATA_DIR: /var/lib/dancemate
      DANCEMATE_LOG_DIR: /var/log/dancemate
      DANCEMATE_BACKUP_DIR: /var/backups/dancemate
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ${ENGINE_DATA_DIR:-./data/engine}:/app/engine/data
      - ${DANCEMATE_DATA_DIR:-./data/runtime}:/var/lib/dancemate
      - ${DANCEMATE_LOG_DIR:-./logs}:/var/log/dancemate
    # SIGTERM drains the current tick; give it room before Docker escalates.
    stop_grace_period: 45s

volumes:
  postgres-data:
    name: dancemate-postgres-data
